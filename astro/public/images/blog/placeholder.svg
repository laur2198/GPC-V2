<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Green Pheonix blog placeholder">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00FF94" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="grid-cyan" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 0 48 L 48 0" fill="none" stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0A0A0A"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#grid-cyan)"/>

  <line x1="0" y1="450" x2="1600" y2="450" stroke="#00FF94" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#00FF94" stroke-opacity="0.12" stroke-width="1"/>

  <g transform="translate(800 420)" text-anchor="middle">
    <text x="0" y="-90" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="6" fill="#00E5FF" opacity="0.7">// BLOG POST</text>
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="80" font-weight="700" fill="#00FF94" filter="url(#glow)">GREEN PHEONIX</text>
    <text x="0" y="56" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="4" fill="#E5E5E5" opacity="0.5">[ HERO IMAGE PLACEHOLDER ]</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#E5E5E5" opacity="0.4" letter-spacing="2">
    <text x="40" y="56">◉ ONLINE</text>
    <text x="1560" y="56" text-anchor="end">VER_2.5</text>
    <text x="40" y="864">LOC: BRAȘOV [45.6579° N, 25.6012° E]</text>
    <text x="1560" y="864" text-anchor="end">// REC</text>
  </g>
</svg>
